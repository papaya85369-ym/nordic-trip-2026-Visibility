name: Find Creative Commons travel photos
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pillow
      - name: Search and download Wikimedia Commons photos
        run: python fetch_photos.py
      - name: Commit thumbnail candidates and credits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images PHOTO_CREDITS.json PHOTO_REVIEW.md photo-credits.html
          if ! git diff --cached --quiet; then git commit -m 'Add open-licensed photo candidates and attribution'; git push; fi
